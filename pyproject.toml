[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minitrain"
version = "0.1.0"
description = "A distributed LLM training systems lab"
requires-python = ">=3.10"
dependencies = ["torch>=2.4"]

[tool.setuptools.packages.find]
include = ["minitrain*"]

